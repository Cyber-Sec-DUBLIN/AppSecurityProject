[package]
name = "slopshop-backend"
version = "0.0.0"
edition = "2021"
publish = false

# v0 BASELINE — intentionally insecure training application.
# Do not deploy. Localhost + synthetic data only. See docs/VULNERABILITIES.md.

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }

[profile.dev]
opt-level = 0
